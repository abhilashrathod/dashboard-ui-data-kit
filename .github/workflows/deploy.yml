name: Deploy to GitHub Pages

# Site layout:
#   /<repo>/       Storybook
#   /<repo>/demo/  Demo dashboard (MSW mocks enabled; there is no real backend)
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-progress deployment; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # base_path is "/<repo>" for project sites and "" for user sites or custom domains.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # No base override needed: Storybook's Vite builder emits relative URLs
      # (base "./"), so the build works at /<repo>/ as-is.
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Build demo
        run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/demo/
          VITE_ENABLE_MOCKS: 'true'

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R storybook-static/. _site/
          cp -R dist _site/demo

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
